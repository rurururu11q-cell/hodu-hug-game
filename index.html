<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8f4"><title>호두 껴안아주기</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;color:#4c3935;background:#fff8f4}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:20px}.game{width:min(100%,480px);text-align:center;background:#fffdfb;border:3px solid #4c3935;border-radius:28px;padding:26px 18px 30px;box-shadow:8px 8px 0 #f4ded4}h1{font-size:clamp(25px,7vw,34px);margin:0 0 8px}.sub{color:#89736c;margin:0 0 18px}.count{font-size:clamp(32px,9vw,48px);font-weight:900;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.count-label{font-size:14px;color:#89736c}.stage{height:310px;position:relative;display:grid;place-items:center;margin:8px 0}.bubble{position:absolute;top:5px;left:50%;transform:translateX(-50%);background:white;border:2px solid #4c3935;border-radius:20px;padding:12px 14px;width:max-content;max-width:95%;font-weight:700;z-index:2;box-shadow:3px 4px 0 #ecd7cf}.bubble:after{content:"";position:absolute;bottom:-10px;left:calc(50% - 8px);width:15px;height:15px;background:white;border-right:2px solid #4c3935;border-bottom:2px solid #4c3935;transform:rotate(45deg)}.character{margin-top:48px;width:min(240px,75vw);height:225px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;touch-action:manipulation;position:relative}.character:focus-visible{outline:3px solid #f19a9c;border-radius:20px}.character:disabled{cursor:not-allowed}.character img{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none}.placeholder{font-size:115px;line-height:1;filter:drop-shadow(0 7px 0 #e9d0c6);user-select:none}.character.hug{animation:hug .28s ease-out}@keyframes hug{0%,100%{transform:scale(1)}45%{transform:scale(1.13) rotate(-3deg)}}.heart{position:absolute;left:50%;top:42%;pointer-events:none;font-size:28px;animation:float 900ms ease-out forwards}@keyframes float{to{transform:translate(var(--dx),-110px) rotate(18deg);opacity:0}}.message{min-height:56px;font-weight:700;line-height:1.6}.muted{color:#8c7972;font-weight:500}.timer{font-size:20px;font-variant-numeric:tabular-nums}.hint{font-size:13px;color:#9b8981;margin:16px 0 0}.hidden{display:none!important}@media(max-width:370px){.game{padding:20px 12px}.stage{height:285px}.character{height:205px}}
</style></head><body><main class="game"><h1>호두 껴안아주기 ♡</h1><p class="sub">호두를 많이많이 안아주자!</p><div class="count-label">지금까지 껴안아준 횟수</div><div id="count" class="count" aria-live="polite">0</div><section class="stage" aria-label="호두 캐릭터"><div id="bubble" class="bubble hidden">나 잠깐 답멘 밀고 옴 ㅋㅋ</div><button id="hodu" class="character" aria-label="호두 껴안아주기"><img id="hodu-image" src="hodu.png" alt="호두" class="hidden"><span id="placeholder" class="placeholder" aria-hidden="true">🐻</span></button></section><div id="message" class="message" aria-live="polite">호두를 눌러서 껴안아줘!</div><p class="hint">클릭 또는 터치로 포옹 · 기록은 이 기기에 저장돼요</p></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),button=$('hodu'),countEl=$('count'),bubble=$('bubble'),message=$('message'),img=$('hodu-image'),placeholder=$('placeholder');const COUNT_KEY='hodu-hugs-v1',AWAY_KEY='hodu-away-until-v1';let count=0,awayUntil=0,hugsSinceReturn=0,nextAwayAt=8+Math.floor(Math.random()*13),lastHug=0;try{const raw=localStorage.getItem(COUNT_KEY);if(raw&&/^\d+$/.test(raw))count=Number(raw);const away=Number(localStorage.getItem(AWAY_KEY));if(Number.isFinite(away)&&away>Date.now())awayUntil=away}catch(e){}countEl.textContent=count.toLocaleString('ko-KR');img.addEventListener('load',()=>{img.classList.remove('hidden');placeholder.classList.add('hidden')});img.addEventListener('error',()=>{img.classList.add('hidden');placeholder.classList.remove('hidden')});if(img.complete&&img.naturalWidth){img.classList.remove('hidden');placeholder.classList.add('hidden')}function persist(){try{localStorage.setItem(COUNT_KEY,String(count))}catch(e){}}function persistAway(){try{if(awayUntil)localStorage.setItem(AWAY_KEY,String(awayUntil));else localStorage.removeItem(AWAY_KEY)}catch(e){}}function render(){const remaining=Math.max(0,Math.ceil((awayUntil-Date.now())/1000));if(awayUntil&&remaining===0){awayUntil=0;hugsSinceReturn=0;nextAwayAt=8+Math.floor(Math.random()*13);persistAway()}const away=remaining>0;button.disabled=away;bubble.classList.toggle('hidden',!away);message.innerHTML=away?'잠시만 기다려주자.<div class="muted timer">'+remaining+'초 후 돌아와요</div>':'호두를 눌러서 껴안아줘!'}function heart(){const h=document.createElement('span');h.className='heart';h.textContent='♥';h.style.color=['#ef8f9b','#f4b4a0','#e6a0bf'][Math.floor(Math.random()*3)];h.style.setProperty('--dx',(Math.random()*120-60)+'px');button.append(h);setTimeout(()=>h.remove(),950)}button.addEventListener('click',()=>{if(awayUntil>Date.now())return;const now=Date.now();if(now-lastHug<75)return;lastHug=now;count+=1;countEl.textContent=count.toLocaleString('ko-KR');persist();heart();button.classList.remove('hug');void button.offsetWidth;button.classList.add('hug');hugsSinceReturn++;if(hugsSinceReturn>=nextAwayAt){awayUntil=Date.now()+30000;persistAway();render()}});render();setInterval(render,250)})();
</script></body></html>
