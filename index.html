<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8f4"><title>호두 껴안아주기</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;color:#4c3935;background:#fff8f4}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:20px}.game{width:min(100%,480px);text-align:center;background:#fffdfb;border:3px solid #4c3935;border-radius:28px;padding:26px 18px 30px;box-shadow:8px 8px 0 #f4ded4}h1{font-size:clamp(25px,7vw,34px);margin:0 0 8px}.sub{color:#89736c;margin:0 0 18px}.count{font-size:clamp(32px,9vw,48px);font-weight:900;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.count-label{font-size:14px;color:#89736c}.stage{height:310px;position:relative;display:grid;place-items:center;margin:8px 0}.bubble{position:absolute;top:5px;left:50%;transform:translateX(-50%);background:white;border:2px solid #4c3935;border-radius:20px;padding:12px 14px;width:max-content;max-width:95%;font-weight:700;z-index:2;box-shadow:3px 4px 0 #ecd7cf}.bubble:after{content:"";position:absolute;bottom:-10px;left:calc(50% - 8px);width:15px;height:15px;background:white;border-right:2px solid #4c3935;border-bottom:2px solid #4c3935;transform:rotate(45deg)}.character{margin-top:48px;width:min(240px,75vw);height:225px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;touch-action:manipulation;position:relative}.character:focus-visible{outline:3px solid #f19a9c;border-radius:20px}.character:disabled{cursor:not-allowed}.character img{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none}.placeholder{font-size:115px;line-height:1;filter:drop-shadow(0 7px 0 #e9d0c6);user-select:none}.character.hug{animation:hug .28s ease-out}@keyframes hug{0%,100%{transform:scale(1)}45%{transform:scale(1.13) rotate(-3deg)}}.heart{position:absolute;left:50%;top:42%;pointer-events:none;font-size:28px;animation:float 900ms ease-out forwards}@keyframes float{to{transform:translate(var(--dx),-110px) rotate(18deg);opacity:0}}.message{min-height:56px;font-weight:700;line-height:1.6}.muted{color:#8c7972;font-weight:500}.timer{font-size:20px;font-variant-numeric:tabular-nums}.hint{font-size:13px;color:#9b8981;margin:16px 0 0}.hidden{display:none!important}.settings-btn{margin-top:14px;border:2px solid #4c3935;background:#fff;border-radius:14px;padding:9px 15px;font-weight:700;color:#4c3935;cursor:pointer}.settings{margin-top:18px;text-align:left;border-top:2px dashed #ead9d1;padding-top:16px}.settings h2{font-size:19px;margin:0 0 12px}.settings label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}.settings input[type=text]{width:100%;padding:11px;border:1.5px solid #d5c4bc;border-radius:10px;font:inherit}.settings input[type=file]{width:100%;font-size:13px}.settings .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.settings .actions button{border:1.5px solid #4c3935;background:#fff;border-radius:10px;padding:9px 12px;cursor:pointer}.settings .actions .primary{background:#4c3935;color:white}.settings small{display:block;color:#89736c;margin-top:5px;line-height:1.5}@media(max-width:370px){.game{padding:20px 12px}.stage{height:285px}.character{height:205px}}
</style></head><body><main class="game"><h1 id="game-title">호두 껴안아주기 ♡</h1><p id="game-subtitle" class="sub">호두를 많이많이 안아주자!</p><div id="count-label" class="count-label">지금까지 껴안아준 횟수</div><div id="count" class="count" aria-live="polite">0</div><section class="stage" aria-label="호두 캐릭터"><div id="bubble" class="bubble hidden">나 잠깐 답멘 밀고 옴 ㅋㅋ</div><button id="hodu" class="character" aria-label="호두 껴안아주기"><img id="hodu-image" alt="호두" class="hidden"><span id="placeholder" class="placeholder" aria-hidden="true">🐻</span></button></section><div id="message" class="message" aria-live="polite">호두를 눌러서 껴안아줘!</div><p class="hint">클릭 또는 터치로 포옹 · 기록은 이 기기에 저장돼요</p><button id="settings-toggle" class="settings-btn" aria-expanded="false" aria-controls="settings">⚙ 내 캐릭터 꾸미기</button><section id="settings" class="settings hidden"><h2>나만의 캐릭터 설정</h2><small>변경 사항은 이 브라우저에만 저장돼요. 다른 사람의 화면에는 영향을 주지 않아요.</small><label for="image-idle">기본 이미지 (PNG/JPG/WebP)</label><input id="image-idle" type="file" accept="image/png,image/jpeg,image/webp"><label for="image-hug">포옹 이미지</label><input id="image-hug" type="file" accept="image/png,image/jpeg,image/webp"><label for="image-away">외출 이미지</label><input id="image-away" type="file" accept="image/png,image/jpeg,image/webp"><label for="text-title">제목</label><input id="text-title" type="text" maxlength="60"><label for="text-subtitle">소개 문구</label><input id="text-subtitle" type="text" maxlength="100"><label for="text-count">횟수 설명</label><input id="text-count" type="text" maxlength="100"><label for="text-prompt">기본 안내</label><input id="text-prompt" type="text" maxlength="100"><label for="text-bubble">외출 말풍선</label><input id="text-bubble" type="text" maxlength="100"><label for="text-wait">대기 안내</label><input id="text-wait" type="text" maxlength="100"><div class="actions"><button id="save-settings" class="primary" type="button">설정 저장</button><button id="reset-settings" type="button">기본 설정으로 복원</button></div><small id="settings-status" role="status"></small></section></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),button=$('hodu'),countEl=$('count'),bubble=$('bubble'),message=$('message'),img=$('hodu-image'),placeholder=$('placeholder');const COUNT_KEY='hodu-hugs-v1',AWAY_KEY='hodu-away-until-v1';const IMAGES={idle:'hodu-idle.png',hug:'hodu-hug.png',away:'hodu-away.png'};const TEXT_DEFAULT={title:'호두 껴안아주기 ♡',subtitle:'호두를 많이많이 안아주자!',count:'지금까지 껴안아준 횟수',prompt:'호두를 눌러서 껴안아줘!',bubble:'나 잠깐 답멘 밀고 옴 ㅋㅋ',wait:'잠시만 기다려주자.'};const TEXT_IDS={title:'game-title',subtitle:'game-subtitle',count:'count-label',bubble:'bubble'};const TEXT_INPUTS={title:'text-title',subtitle:'text-subtitle',count:'text-count',prompt:'text-prompt',bubble:'text-bubble',wait:'text-wait'};const CUSTOM_TEXT_KEY='hodu-custom-text-v3';let customText={...TEXT_DEFAULT};try{const saved=JSON.parse(localStorage.getItem(CUSTOM_TEXT_KEY)||'{}');for(const k of Object.keys(TEXT_DEFAULT))if(typeof saved[k]==='string')customText[k]=saved[k]}catch(e){}function applyText(){for(const [key,id] of Object.entries(TEXT_IDS))$(id).textContent=customText[key];for(const [key,id] of Object.entries(TEXT_INPUTS))$(id).value=customText[key]}applyText();let count=0n,awayUntil=0,hugsSinceReturn=0,nextAwayAt=8+Math.floor(Math.random()*13),lastHug=0,hugTimeout=null,mode='';try{const raw=localStorage.getItem(COUNT_KEY);if(raw&&/^\d+$/.test(raw))count=BigInt(raw);const away=Number(localStorage.getItem(AWAY_KEY));if(Number.isFinite(away)&&away>Date.now())awayUntil=away}catch(e){}countEl.textContent=count.toLocaleString('ko-KR');
const loaded={};const customUrls={};function loadImage(state,src){loaded[state]=false;const pre=new Image();pre.onload=()=>{loaded[state]=true;if(mode===state)showImage(state)};pre.onerror=()=>{loaded[state]=false;if(mode===state)showImage(state)};pre.src=src}for(const [state,src] of Object.entries(IMAGES))loadImage(state,src);
const DB_NAME='hodu-custom-images-v3';let db=null;const dbReady=new Promise(resolve=>{if(!('indexedDB'in window)){resolve(null);return}const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>req.result.createObjectStore('images');req.onsuccess=()=>{db=req.result;resolve(db)};req.onerror=()=>resolve(null)});function storeImage(state,file){return new Promise((resolve,reject)=>{if(!db){reject(new Error('이 브라우저에서는 이미지 저장을 지원하지 않아요.'));return}const tx=db.transaction('images','readwrite');tx.objectStore('images').put(file,state);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}function deleteImages(){return new Promise((resolve,reject)=>{if(!db){resolve();return}const tx=db.transaction('images','readwrite');tx.objectStore('images').clear();tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}function setCustomImage(state,blob){if(customUrls[state])URL.revokeObjectURL(customUrls[state]);customUrls[state]=URL.createObjectURL(blob);loadImage(state,customUrls[state])}dbReady.then(database=>{if(!database)return;for(const state of Object.keys(IMAGES)){const req=database.transaction('images','readonly').objectStore('images').get(state);req.onsuccess=()=>{if(req.result)setCustomImage(state,req.result)}}});
function showImage(state){mode=state;const available=loaded[state]===true;if(available){if(img.getAttribute('src')!==(customUrls[state]||IMAGES[state]))img.src=(customUrls[state]||IMAGES[state]);img.classList.remove('hidden');placeholder.classList.add('hidden')}else{img.classList.add('hidden');placeholder.classList.remove('hidden')}}
function persist(){try{localStorage.setItem(COUNT_KEY,String(count))}catch(e){}}function persistAway(){try{if(awayUntil)localStorage.setItem(AWAY_KEY,String(awayUntil));else localStorage.removeItem(AWAY_KEY)}catch(e){}}
function render(){let remaining=Math.max(0,Math.ceil((awayUntil-Date.now())/1000));if(awayUntil&&remaining===0){awayUntil=0;hugsSinceReturn=0;nextAwayAt=8+Math.floor(Math.random()*13);persistAway()}const away=remaining>0;button.disabled=away;bubble.classList.toggle('hidden',!away);if(away){clearTimeout(hugTimeout);showImage('away');message.textContent=customText.wait;const timer=document.createElement('div');timer.className='muted timer';timer.textContent=remaining+'초 후 돌아와요';message.append(timer)}else{if(mode==='away')showImage('idle');message.textContent=customText.prompt}}
function heart(){const h=document.createElement('span');h.className='heart';h.textContent='♥';h.style.color=['#ef8f9b','#f4b4a0','#e6a0bf'][Math.floor(Math.random()*3)];h.style.setProperty('--dx',(Math.random()*120-60)+'px');button.append(h);setTimeout(()=>h.remove(),950)}
button.addEventListener('click',()=>{if(awayUntil>Date.now())return;const now=Date.now();if(now-lastHug<75)return;lastHug=now;count+=1n;countEl.textContent=count.toLocaleString('ko-KR');persist();heart();button.classList.remove('hug');void button.offsetWidth;button.classList.add('hug');showImage('hug');clearTimeout(hugTimeout);hugTimeout=setTimeout(()=>{if(awayUntil<=Date.now())showImage('idle')},450);hugsSinceReturn++;if(hugsSinceReturn>=nextAwayAt){awayUntil=Date.now()+5000;persistAway();render()}});$('settings-toggle').addEventListener('click',()=>{const open=$('settings').classList.toggle('hidden')===false;$('settings-toggle').setAttribute('aria-expanded',String(open))});$('save-settings').addEventListener('click',async()=>{const status=$('settings-status');status.textContent='저장 중…';for(const [key,id] of Object.entries(TEXT_INPUTS))customText[key]=$(id).value.trim()||TEXT_DEFAULT[key];try{localStorage.setItem(CUSTOM_TEXT_KEY,JSON.stringify(customText))}catch(e){status.textContent='텍스트 저장에 실패했어요.';return}applyText();await dbReady;let failed=false;for(const state of Object.keys(IMAGES)){const file=$('image-'+state).files[0];if(!file)continue;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>8*1024*1024){failed=true;continue}try{await storeImage(state,file);setCustomImage(state,file);$('image-'+state).value=''}catch(e){failed=true}}render();status.textContent=failed?'일부 이미지 저장 실패: PNG/JPG/WebP, 각 8MB 이하인지 확인해 줘.':'설정을 저장했어요!'});$('reset-settings').addEventListener('click',async()=>{if(!confirm('캐릭터 이미지와 문구를 기본값으로 되돌릴까요? 포옹 횟수는 유지돼요.'))return;await dbReady;try{await deleteImages()}catch(e){}for(const state of Object.keys(IMAGES)){if(customUrls[state])URL.revokeObjectURL(customUrls[state]);delete customUrls[state];loadImage(state,IMAGES[state]);$('image-'+state).value=''}customText={...TEXT_DEFAULT};try{localStorage.removeItem(CUSTOM_TEXT_KEY)}catch(e){}applyText();render();$('settings-status').textContent='기본 설정으로 복원했어요.'});showImage(awayUntil>Date.now()?'away':'idle');render();setInterval(render,200)})();
</script></body></html>
